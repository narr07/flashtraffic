[package]
name = "flashtraffic"
version = "0.1.0"
description = "Modern Web Traffic Simulation & Analytics Load Testing Desktop Platform"
authors = ["FlashTraffic Team"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "flashtraffic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-store = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
urlencoding = "2.1"
regex = "1.11"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
